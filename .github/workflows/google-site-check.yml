name: Google SEO Health Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  check-google-crawl-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check site URL setting
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set repository variable SITE_URL to your live website URL, e.g. https://example.vercel.app"
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::SITE_URL must start with https://"; exit 1 ;;
          esac
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Check homepage, robots.txt, and sitemap.xml
        run: |
          set -euo pipefail
          check_url() {
            label="$1"
            url="$2"
            code="$(curl --location --silent --show-error --output /tmp/response.txt --write-out '%{http_code}' --max-time 30 "$url")"
            echo "$label: HTTP $code ($url)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::$label returned HTTP $code"
              exit 1
            fi
          }
          check_url "Homepage" "$SITE_URL/"
          check_url "robots.txt" "$SITE_URL/robots.txt"
          check_url "sitemap.xml" "$SITE_URL/sitemap.xml"

          sitemap_body="$(curl --location --silent --show-error --fail --max-time 30 "$SITE_URL/sitemap.xml")"
          if ! printf '%s' "$sitemap_body" | grep -Eqi '<(urlset|sitemapindex)([[:space:]>])'; then
            echo "::error::sitemap.xml did not appear to contain a valid sitemap root element."
            exit 1
          fi
          echo "Basic crawl-readiness checks passed."

      - name: Submit sitemap through Google Search Console API
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          if [ -z "$GOOGLE_CREDS" ] || [ -z "$GSC_PROPERTY" ]; then
            echo "::warning::Automatic sitemap submission skipped. Configure GOOGLE_CREDS secret and GSC_PROPERTY variable; the workflow still checks sitemap availability."
            exit 0
          fi
          npm init -y >/dev/null
          npm install googleapis --no-audit --no-fund
          node <<'NODE'
          const { google } = require('googleapis');

          async function main() {
            const credentials = JSON.parse(process.env.GOOGLE_CREDS);
            const auth = new google.auth.GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/webmasters'],
            });
            const client = await auth.getClient();
            const searchConsole = google.webmasters({ version: 'v3', auth: client });
            const siteUrl = process.env.GSC_PROPERTY;
            const baseUrl = process.env.SITE_URL.replace(/\/$/, '');
            const feedpath = baseUrl + '/sitemap.xml';

            await searchConsole.sitemaps.submit({ siteUrl, feedpath });
            console.log('Google Search Console accepted sitemap submission: ' + feedpath);
            console.log('This is a sitemap submission, not a guarantee of crawling or indexing.');
          }

          main().catch((error) => {
            console.error('Sitemap submission failed:', error.message);
            process.exit(1);
          });
          NODE

      - name: Next steps
        if: success()
        run: |
          echo "Google sitemap check/submission workflow finished."
          echo "Google decides when and whether individual pages are crawled and indexed."
