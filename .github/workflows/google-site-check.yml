name: Google SEO Crawl Readiness (No API Key)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Daily at 05:23 UTC. This checks discoverability; it does not force Google to crawl.
    - cron: "23 5 * * *"

permissions:
  contents: read

env:
  SITE_URL: https://universal-respiratory.vercel.app

jobs:
  check-google-crawl-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check every public page, robots.txt, and sitemap.xml
        shell: bash
        run: |
          set -euo pipefail

          pages=(
            "/"
            "/word-counter.html"
            "/case-converter.html"
            "/universal-time.html"
            "/stopwatch.html"
          )

          check_url() {
            local path="$1"
            local url="${SITE_URL}${path}"
            local code
            code="$(curl --location --silent --show-error --output /tmp/seo-response.txt --write-out '%{http_code}' --max-time 30 "$url")"
            echo "HTTP $code $url"
            if [[ "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "::error::URL returned HTTP $code: $url"
              exit 1
            fi
          }

          for path in "${pages[@]}"; do
            check_url "$path"
          done
          check_url "/robots.txt"
          check_url "/sitemap.xml"

          curl --location --silent --show-error --fail --max-time 30 "$SITE_URL/sitemap.xml" -o /tmp/sitemap.xml
          if ! grep -Eqi '<urlset([[:space:]>])|<sitemapindex([[:space:]>])' /tmp/sitemap.xml; then
            echo "::error::sitemap.xml does not have a valid sitemap root element."
            exit 1
          fi

          for path in "${pages[@]}"; do
            expected="${SITE_URL}${path}"
            if ! grep -Fq "<loc>${expected}</loc>" /tmp/sitemap.xml; then
              echo "::error::Sitemap is missing ${expected}"
              exit 1
            fi
            echo "Sitemap includes: $expected"
          done

          if ! grep -Fq "Sitemap: ${SITE_URL}/sitemap.xml" <(curl --location --silent --show-error --fail --max-time 30 "$SITE_URL/robots.txt"); then
            echo "::error::robots.txt does not reference the sitemap URL."
            exit 1
          fi

          echo "All page, robots.txt, and sitemap checks passed."

      - name: Explain indexing limits
        if: success()
        run: |
          echo "No Google API key or service-account secret is required."
          echo "This workflow checks crawl readiness only; it does not submit URLs through the Search Console API."
          echo "Google controls crawl timing and whether pages are indexed. A successful check is not an indexing guarantee."
