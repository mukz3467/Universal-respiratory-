name: Google Indexing API Auto Push

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google API Library Directly
        run: npm install googleapis --no-save --legacy-peer-deps --no-package-lock

      - name: Run Indexing Script
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: node index-script.js
